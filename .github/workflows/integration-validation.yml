        run: |
          psql "$CLEAN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO employees (id, employee_number, full_name, status) VALUES
            ('00000000-0000-4000-8000-000000000010', 'SYN-APPROVER', 'Synthetic Approver', 'active'),
            ('00000000-0000-4000-8000-000000000011', 'SYN-PENDING', 'Synthetic Pending', 'active'),
            ('00000000-0000-4000-8000-000000000012', 'SYN-OVERLAP', 'Synthetic Overlap', 'active'),
            ('00000000-0000-4000-8000-000000000013', 'SYN-HAJJ-ACTIVE', 'Synthetic Hajj Active', 'active'),
            ('00000000-0000-4000-8000-000000000014', 'SYN-HAJJ-FINAL', 'Synthetic Hajj Final', 'active'),
            ('00000000-0000-4000-8000-000000000015', 'SYN-HC-TASK', 'Synthetic HC Task', 'active'),
            ('00000000-0000-4000-8000-000000000016', 'SYN-PAYSLIP', 'Synthetic Payslip', 'active');

          INSERT INTO accounts (id, employee_id, email, principal_type, status)
          VALUES (
            '00000000-0000-4000-8000-000000000020',
            '00000000-0000-4000-8000-000000000016',
            'synthetic-payslip@example.invalid',
            'EMPLOYEE',
            'active'
          );

          INSERT INTO leave_requests (
            id, employee_id, policy_key, status, start_on, end_on, working_days,
            hc_handling, idempotency_key
