name: Integration Validation

on:
  push:
    branches:
      - agent/mvp-integration
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI_PG_USER: hcis
  CI_PG_PASSWORD: hcis_ci_password
  CI_AUTH_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"

jobs:
  quality-gates:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hcis
          POSTGRES_PASSWORD: hcis_ci_password
          POSTGRES_DB: hcis_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcis -d hcis_quality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3001
      DATABASE_URL: postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_quality
      AUTH_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      AUTH_SESSION_TTL_HOURS: 8

    steps:
      - name: Publish validation run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(jq -n \
            --arg state "success" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Locator for Integration Validation run ${GITHUB_RUN_ID}" \
            --arg context "integration-validation/locator" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"

      - name: Checkout frozen integration tree
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create synthetic API environment
        run: |
          cat > apps/api/.env.local <<'EOF'
          NODE_ENV=test
          HOST=127.0.0.1
          PORT=3001
          DATABASE_URL=postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_quality
          AUTH_ENCRYPTION_KEY=1111111111111111111111111111111111111111111111111111111111111111
          AUTH_SESSION_TTL_HOURS=8
          EOF

      - name: npm ci
        id: install
        run: npm ci

      - name: Typecheck
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build

  clean-database:
    name: Clean migration and DB invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hcis
          POSTGRES_PASSWORD: hcis_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcis -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: hcis_ci_password
      CLEAN_DATABASE_URL: postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_clean

    steps:
      - name: Checkout frozen integration tree
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create empty clean database
        run: |
          psql -h 127.0.0.1 -U "$CI_PG_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE hcis_clean;'

      - name: Create synthetic API environment for clean database
        run: |
          cat > apps/api/.env.local <<EOF
          NODE_ENV=test
          HOST=127.0.0.1
          PORT=3001
          DATABASE_URL=${CLEAN_DATABASE_URL}
          AUTH_ENCRYPTION_KEY=${CI_AUTH_ENCRYPTION_KEY}
          AUTH_SESSION_TTL_HOURS=8
          EOF

      - name: Run clean migration
        run: |
          set -o pipefail
          npm run migrate:api | tee /tmp/clean-migrate.log

      - name: Verify clean migration order and schema_migrations
        run: |
          cat > /tmp/expected-all.txt <<'EOF'
          0001_employee_foundation.sql
          0002_auth_bootstrap.sql
          0003_employee_admin_surface.sql
          0004_org_access_foundation.sql
          0005_leave_policy_foundation.sql
          0006_annual_leave_vertical_slice.sql
          0007_special_leave_hc_validation.sql
          0008_attendance_resolution.sql
          0009_account_activation.sql
          0010_attendance_daily_records.sql
          0011_leave_completion_invariants.sql
          0012_leave_request_overlap_guard.sql
          0013_planned_unpaid_leave.sql
          0017_payslip_mvp.sql
          0018_payslip_published_immutability.sql
          0019_dynamic_organization.sql
          EOF

          sed -n 's/^applied //p' /tmp/clean-migrate.log > /tmp/clean-applied.txt
          diff -u /tmp/expected-all.txt /tmp/clean-applied.txt

          psql "$CLEAN_DATABASE_URL" -At -v ON_ERROR_STOP=1 \
            -c 'SELECT name FROM schema_migrations ORDER BY name' > /tmp/clean-recorded.txt
          diff -u /tmp/expected-all.txt /tmp/clean-recorded.txt

