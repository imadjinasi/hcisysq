          SQL

  upgrade-database:
    name: Upgrade migration from original base through 0010
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hcis
          POSTGRES_PASSWORD: hcis_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcis -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: hcis_ci_password
      UPGRADE_DATABASE_URL: postgres://hcis:hcis_ci_password@127.0.0.1:5432/hcis_upgrade
      ORIGINAL_BASE_SHA: ac96aadc263d18715a83cd0d2812d432a59464fb

    steps:
      - name: Checkout integration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create empty upgrade database
        run: |
          psql -h 127.0.0.1 -U "$CI_PG_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE hcis_upgrade;'

      - name: Populate original frozen base migration state through 0010
        run: |
          set -euo pipefail
          git cat-file -e "${ORIGINAL_BASE_SHA}^{commit}"

          psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE schema_migrations (
            name text PRIMARY KEY,
            applied_at timestamptz NOT NULL DEFAULT now()
          );
          SQL

          cat > /tmp/base-migrations.txt <<'EOF'
          0001_employee_foundation.sql
          0002_auth_bootstrap.sql
          0003_employee_admin_surface.sql
          0004_org_access_foundation.sql
          0005_leave_policy_foundation.sql
          0006_annual_leave_vertical_slice.sql
          0007_special_leave_hc_validation.sql
          0008_attendance_resolution.sql
          0009_account_activation.sql
          0010_attendance_daily_records.sql
          EOF

          while IFS= read -r migration; do
            git show "${ORIGINAL_BASE_SHA}:apps/api/migrations/${migration}" > "/tmp/${migration}"
            psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "/tmp/${migration}"
            psql "$UPGRADE_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "INSERT INTO schema_migrations (name) VALUES ('${migration}')"
          done < /tmp/base-migrations.txt

          psql "$UPGRADE_DATABASE_URL" -At -v ON_ERROR_STOP=1 \
            -c 'SELECT name FROM schema_migrations ORDER BY name' > /tmp/base-recorded.txt
          diff -u /tmp/base-migrations.txt /tmp/base-recorded.txt

      - name: Create synthetic API environment for upgrade database
        run: |
          cat > apps/api/.env.local <<EOF
          NODE_ENV=test
          HOST=127.0.0.1
          PORT=3001
          DATABASE_URL=${UPGRADE_DATABASE_URL}
          AUTH_ENCRYPTION_KEY=${CI_AUTH_ENCRYPTION_KEY}
          AUTH_SESSION_TTL_HOURS=8
          EOF

      - name: Run current migration runner against base state
        run: |
          set -o pipefail
          npm run migrate:api | tee /tmp/upgrade-migrate.log

      - name: Verify upgrade applies only integration migrations
        run: |
          cat > /tmp/expected-new.txt <<'EOF'
          0011_leave_completion_invariants.sql
          0012_leave_request_overlap_guard.sql
          0013_planned_unpaid_leave.sql
          0017_payslip_mvp.sql
          0018_payslip_published_immutability.sql
          0019_dynamic_organization.sql
          EOF

          sed -n 's/^applied //p' /tmp/upgrade-migrate.log > /tmp/upgrade-applied.txt
          diff -u /tmp/expected-new.txt /tmp/upgrade-applied.txt

          cat /tmp/base-migrations.txt /tmp/expected-new.txt > /tmp/expected-all.txt
          psql "$UPGRADE_DATABASE_URL" -At -v ON_ERROR_STOP=1 \
            -c 'SELECT name FROM schema_migrations ORDER BY name' > /tmp/upgrade-recorded.txt
          diff -u /tmp/expected-all.txt /tmp/upgrade-recorded.txt
