openapi: 3.1.0
info:
  title: HCIS YSQ API
  version: 0.0.1
  description: |
    Kontrak awal untuk vertical slice identity, employee profile, leave, organization, dan attendance operations.
    Status dokumen DRAFT; endpoint belum menyatakan implementasi telah tersedia.
servers:
  - url: https://api.example.invalid
    description: Placeholder only

tags:
  - name: System
  - name: Session
  - name: Employees
  - name: Leave
  - name: Approvals
  - name: Organization
  - name: Attendance

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /session:
    get:
      tags: [Session]
      operationId: getCurrentSession
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /employees/me:
    get:
      tags: [Employees]
      operationId: getMyEmployeeProfile
      responses:
        '200':
          description: Employee profile visible to the current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leave/preview:
    post:
      tags: [Leave]
      operationId: previewLeaveRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '200':
          description: Non-persistent leave calculation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeavePreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leave/requests:
    get:
      tags: [Leave]
      operationId: listMyLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current employee leave requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveRequest'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Leave]
      operationId: submitLeaveRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Domain conflict such as overlapping request or stale state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leave/requests/{requestId}:
    get:
      tags: [Leave]
      operationId: getLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Authorized request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /approvals/tasks:
    get:
      tags: [Approvals]
      operationId: listMyApprovalTasks
      responses:
        '200':
          description: Active approval tasks for current actor
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /approvals/tasks/{taskId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApprovalTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, version]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: [string, 'null']
                  maxLength: 2000
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Decision committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Task already decided or version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/attendance/adms/devices:
    get:
      tags: [Attendance]
      operationId: listAdmsDevices
      summary: List registered ADMS fingerprint devices
      responses:
        '200':
          description: Device registry with current mapping and unmapped-PIN counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdmsDevice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Attendance]
      operationId: registerAdmsDevice
      summary: Explicitly register an ADMS device serial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialNumber]
              properties:
                serialNumber: { type: string, minLength: 1, maxLength: 128 }
                displayName: { type: [string, 'null'], maxLength: 160 }
                timezone: { type: string, default: Asia/Jakarta, maxLength: 100 }
      responses:
        '201':
          description: Registered active device
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/AdmsDevice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Serial already registered }

  /admin/attendance/adms/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Attendance]
      operationId: getAdmsDevice
      summary: Read ADMS device observability and mapping detail
      responses:
        '200':
          description: Device, mapping history, observed PINs, recent raw events, and quarantine outcomes; raw request body is excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmsDeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Attendance]
      operationId: updateAdmsDevice
      summary: Update lifecycle or operational device metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: [string, 'null'], maxLength: 160 }
                lifecycle: { type: string, enum: [active, disabled, quarantined] }
                timezone: { type: string, maxLength: 100 }
                model: { type: [string, 'null'], maxLength: 160 }
                firmwareVersion: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200':
          description: Updated audited device
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/AdmsDevice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/attendance/adms/devices/{deviceId}/mappings:
    post:
      tags: [Attendance]
      operationId: createAdmsEmployeeMapping
      summary: Map an observed device PIN to an active HCIS employee
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, employeeId]
              properties:
                pin: { type: string, minLength: 1, maxLength: 128, description: Leading zeroes are significant. }
                employeeId: { type: string, format: uuid }
                effectiveFrom: { type: string, format: date-time, description: Must be within the last 62 days and not materially in the future. }
      responses:
        '201':
          description: Mapping created and eligible raw history re-projected on a bounded basis
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Active or effective-window mapping conflict }

  /admin/attendance/adms/mappings/{mappingId}:
    delete:
      tags: [Attendance]
      operationId: endAdmsEmployeeMapping
      summary: End an active mapping at server current time without deleting history
      parameters:
        - name: mappingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Mapping effective window closed and audited }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Mapping already ended or has not started }

  /admin/organization/designer:
    get:
      tags: [Organization]
      operationId: getOrganizationDesigner
      parameters:
        - name: effectiveDate
          in: query
          schema: { type: string, format: date }
        - name: draftId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective published chart or editable draft chart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDesignerView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/employees:
    get:
      tags: [Organization]
      operationId: listOrganizationDesignerEmployees
      responses:
        '200': { description: Employee options for membership and incumbency }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts:
    post:
      tags: [Organization]
      operationId: createOrganizationDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, effectiveOn]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                effectiveOn: { type: string, format: date }
      responses:
        '201':
          description: Draft created from the latest effective published snapshot, or empty when none exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/nodes:
    post:
      tags: [Organization]
      operationId: createOrganizationNode
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNodeInput' }
      responses:
        '201': { description: Organizational group created in the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/nodes/{itemId}:
    patch:
      tags: [Organization]
      operationId: updateOrganizationNode
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNodePatch' }
      responses:
        '200': { description: Organizational group updated within the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/positions:
    post:
      tags: [Organization]
      operationId: createOrganizationPosition
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPositionInput' }
      responses:
        '201': { description: Authority-bearing position created in the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/positions/{itemId}:
    patch:
      tags: [Organization]
      operationId: updateOrganizationPosition
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPositionPatch' }
      responses:
        '200': { description: Structural position updated within the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/memberships:
    put:
      tags: [Organization]
      operationId: replaceOrganizationMemberships
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeKey, employeeIds, effectiveFrom]
              properties:
                nodeKey: { type: string, format: uuid }
                employeeIds: { type: array, maxItems: 500, items: { type: string, format: uuid } }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
      responses:
        '204': { description: Effective memberships replaced for the selected group }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/incumbencies:
    put:
      tags: [Organization]
      operationId: replaceOrganizationIncumbencies
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionKey, effectiveFrom]
              properties:
                positionKey: { type: string, format: uuid }
                primaryEmployeeId: { type: [string, 'null'], format: uuid }
                actingEmployeeId: { type: [string, 'null'], format: uuid }
                actingFrom: { type: [string, 'null'], format: date }
                actingTo: { type: [string, 'null'], format: date }
                effectiveFrom: { type: string, format: date }
      responses:
        '204': { description: Primary, vacant, and explicit acting state replaced }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/authority-bindings:
    post:
      tags: [Organization]
      operationId: createOrganizationAuthorityBinding
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationAuthorityBindingInput' }
      responses:
        '201': { description: Semantic authority relationship created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/reporting-overrides:
    post:
      tags: [Organization]
      operationId: createOrganizationReportingOverride
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, managerPositionKey, reason, effectiveFrom]
              properties:
                employeeId: { type: string, format: uuid }
                managerPositionKey: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
      responses:
        '201': { description: Reasoned effective reporting exception created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/validate:
    post:
      tags: [Organization]
      operationId: validateOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Structural, authority, effective-date, and incumbent validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationValidationReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/impact:
    get:
      tags: [Organization]
      operationId: previewOrganizationImpact
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Authority-routing and visual-only impact preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationImpactPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/resolution-preview:
    post:
      tags: [Organization]
      operationId: previewOrganizationResolution
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, workflowKey, effectiveDate]
              properties:
                employeeId: { type: string, format: uuid }
                workflowKey: { type: string }
                effectiveDate: { type: string, format: date }
      responses:
        '200': { description: Concrete structural authority preview }
        '409': { description: Fail-closed structural configuration error }

  /admin/organization/designer/drafts/{draftId}/publish:
    post:
      tags: [Organization]
      operationId: publishOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Validated snapshot published; a future snapshot does not activate early
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft has not passed validation }

  /admin/organization/rollout:
    get:
      tags: [Organization]
      operationId: getOrganizationRollout
      responses:
        '200': { description: Latest rollout configuration; LEGACY when none exists }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Organization]
      operationId: updateOrganizationRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [LEGACY, SHADOW, STRUCTURE] }
                workflowKey: { type: string, default: LEAVE }
                organizationalNodeKey: { type: [string, 'null'], format: uuid }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Additive effective rollout configuration created and audited }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Actor is not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or intentionally concealed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'

  schemas:
    AdmsDevice:
      type: object
      required: [id, serialNumber, lifecycle, timezone, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        serialNumber: { type: string }
        displayName: { type: [string, 'null'] }
        lifecycle: { type: string, enum: [active, disabled, quarantined] }
        timezone: { type: string }
        model: { type: [string, 'null'] }
        firmwareVersion: { type: [string, 'null'] }
        firstSeenAt: { type: [string, 'null'], format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        lastSuccessfulRequestAt: { type: [string, 'null'], format: date-time }
        lastIp: { type: [string, 'null'] }
        activeMappingCount: { type: integer, minimum: 0 }
        unmappedPinCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdmsDeviceDetail:
      type: object
      required: [item, mappings, observedPins, recentEvents, recentQuarantines]
      properties:
        item: { $ref: '#/components/schemas/AdmsDevice' }
        mappings:
          type: array
          items:
            type: object
            required: [id, pin, employeeId, effectiveFrom, createdAt]
            properties:
              id: { type: string, format: uuid }
              pin: { type: string }
              employeeId: { type: string, format: uuid }
              employeeNumber: { type: string }
              employeeName: { type: string }
              effectiveFrom: { type: string, format: date-time }
              effectiveTo: { type: [string, 'null'], format: date-time }
              createdAt: { type: string, format: date-time }
        observedPins:
          type: array
          items:
            type: object
            required: [pin, eventCount, firstEventAt, lastEventAt]
            properties:
              pin: { type: string, description: Leading zeroes are significant. }
              eventCount: { type: integer, minimum: 1 }
              firstEventAt: { type: string, format: date-time }
              lastEventAt: { type: string, format: date-time }
              mappingId: { type: [string, 'null'], format: uuid }
              employeeId: { type: [string, 'null'], format: uuid }
              employeeNumber: { type: [string, 'null'] }
              employeeName: { type: [string, 'null'] }
        recentEvents:
          type: array
          items:
            type: object
            required: [id, pin, occurredAt, receivedAt, sourceRequestId]
            properties:
              id: { type: string, format: uuid }
              pin: { type: string }
              occurredAt: { type: string, format: date-time }
              receivedAt: { type: string, format: date-time }
              sourceRequestId: { type: string, format: uuid }
        recentQuarantines:
          type: array
          items:
            type: object
            required: [id, reason, details, createdAt, requestId]
            properties:
              id: { type: string, format: uuid }
              reason: { type: string }
              details: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
              requestId: { type: string, format: uuid }

    OrganizationDraft:
      type: object
      required: [id, name, effectiveOn, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        effectiveOn: { type: string, format: date }
        status: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED] }
        validationReport: { oneOf: [{ $ref: '#/components/schemas/OrganizationValidationReport' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }

    OrganizationNodeInput:
      type: object
      required: [name, nodeType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }
        integrationCode: { type: [string, 'null'] }

    OrganizationNodePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        integrationCode: { type: [string, 'null'] }
        active: { type: boolean }

    OrganizationPositionInput:
      type: object
      required: [nodeKey, title]
      properties:
        nodeKey: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        parentPositionKey: { type: [string, 'null'], format: uuid }
        singleIncumbent: { type: boolean, default: true }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }

    OrganizationPositionPatch:
      type: object
      minProperties: 1
      properties:
        nodeKey: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        parentPositionKey: { type: [string, 'null'], format: uuid }
        singleIncumbent: { type: boolean }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        active: { type: boolean }

    OrganizationAuthorityBindingInput:
      type: object
      required: [sourceType, sourceKey, authorityType, targetPositionKey, vacancyPolicy, effectiveFrom]
      properties:
        sourceType: { type: string, enum: [NODE, POSITION] }
        sourceKey: { type: string, format: uuid }
        authorityType: { type: string, enum: [SUPERVISORY_PARENT, LEADER, UNIT_APPROVER, GOVERNANCE_APPROVER, OVERSIGHT_PARENT] }
        targetPositionKey: { type: string, format: uuid }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    OrganizationValidationReport:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              severity: { type: string, enum: [ERROR, WARNING] }
              itemKey: { type: [string, 'null'] }

    OrganizationImpactPreview:
      type: object
      required: [directManagerChanges, unitApproverChanges, authorityPathsAffected, vacantAuthorities, unresolvedEmployees, visualOnlyChanges, noApprovalRoutingImpact]
      properties:
        directManagerChanges: { type: array, items: { type: object } }
        unitApproverChanges: { type: array, items: { type: object } }
        authorityPathsAffected: { type: array, items: { type: object } }
        vacantAuthorities: { type: array, items: { type: object } }
        unresolvedEmployees: { type: array, items: { type: object } }
        visualOnlyChanges: { type: array, items: { type: object } }
        noApprovalRoutingImpact: { type: boolean }

    OrganizationDesignerView:
      type: object
      required: [viewDate, mode, nodes, positions, memberships, assignments, bindings, reportingOverrides]
      properties:
        viewDate: { type: string, format: date }
        mode: { type: string, enum: [HISTORICAL, CURRENT, FUTURE, DRAFT] }
        draft: { oneOf: [{ $ref: '#/components/schemas/OrganizationDraft' }, { type: 'null' }] }
        nodes: { type: array, items: { type: object } }
        positions: { type: array, items: { type: object } }
        memberships: { type: array, items: { type: object } }
        assignments: { type: array, items: { type: object } }
        bindings: { type: array, items: { type: object } }
        reportingOverrides: { type: array, items: { type: object } }

    Session:
      type: object
      required: [actor, permissions]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        permissions:
          type: array
          items:
            type: string

    Actor:
      type: object
      required: [id, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [employee, candidate, system]
        displayName:
          type: string
        employeeId:
          type: [string, 'null']
          format: uuid

    EmployeeProfile:
      type: object
      required: [id, employeeNumber, fullName, status]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum: [active, inactive, resigned]
        unit:
          $ref: '#/components/schemas/Reference'
        position:
          $ref: '#/components/schemas/Reference'
        directManager:
          oneOf:
            - $ref: '#/components/schemas/Reference'
            - type: 'null'

    Reference:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string

    LeaveRequestInput:
      type: object
      required: [leaveTypeId, startDate, endDate, reason]
      properties:
        leaveTypeId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        partialDay:
          type: [string, 'null']
          enum: [null, morning, afternoon]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        attachmentIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid

    LeavePreview:
      type: object
      required: [workingDays, balanceBefore, balanceAfter, conflicts]
      properties:
        workingDays:
          type: number
          minimum: 0
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        conflicts:
          type: array
          items:
            type: string

    LeaveRequest:
      type: object
      required: [id, status, employeeId, leaveType, startDate, endDate, workingDays, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, submitted, in_review, approved, rejected, cancelled]
        employeeId:
          type: string
          format: uuid
        leaveType:
          $ref: '#/components/schemas/Reference'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workingDays:
          type: number
        reason:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    ApprovalTask:
      type: object
      required: [id, requestType, requestId, status, version]
      properties:
        id:
          type: string
          format: uuid
        requestType:
          type: string
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected, skipped, reassigned]
        version:
          type: integer
          minimum: 1

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
