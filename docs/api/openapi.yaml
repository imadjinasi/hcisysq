openapi: 3.1.0
info:
  title: HCIS YSQ API
  version: 0.0.1
  description: |
    Kontrak awal untuk vertical slice identity, employee profile, dan leave.
    Status dokumen DRAFT; endpoint belum menyatakan implementasi telah tersedia.
servers:
  - url: https://api.example.invalid
    description: Placeholder only

tags:
  - name: System
  - name: Session
  - name: Employees
  - name: Leave
  - name: Approvals
  - name: Access
  - name: Organization

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /session:
    get:
      tags: [Session]
      operationId: getCurrentSession
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /employees/me:
    get:
      tags: [Employees]
      operationId: getMyEmployeeProfile
      responses:
        '200':
          description: Employee profile visible to the current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leave/preview:
    post:
      tags: [Leave]
      operationId: previewLeaveRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '200':
          description: Non-persistent leave calculation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeavePreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /leave/requests:
    get:
      tags: [Leave]
      operationId: listMyLeaveRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current employee leave requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveRequest'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Leave]
      operationId: submitLeaveRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Domain conflict such as overlapping request or stale state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /leave/requests/{requestId}:
    get:
      tags: [Leave]
      operationId: getLeaveRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Authorized request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /approvals/tasks:
    get:
      tags: [Approvals]
      operationId: listMyApprovalTasks
      responses:
        '200':
          description: Active approval tasks for current actor
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /approvals/tasks/{taskId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApprovalTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, version]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: [string, 'null']
                  maxLength: 2000
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Decision committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Task already decided or version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /admin/access/employee-accounts/bulk-preview:
    post:
      tags: [Access]
      operationId: previewBulkEmployeeAccess
      summary: Preview canonical account preparation for explicitly selected employees
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkEmployeeAccessInput' }
      responses:
        '200':
          description: Read-only per-employee classification and summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEmployeeAccessPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/access/employee-accounts/bulk-prepare:
    post:
      tags: [Access]
      operationId: prepareBulkEmployeeAccess
      summary: Prepare or align employee accounts without bypassing employee-owned activation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkEmployeeAccessInput' }
      responses:
        '200':
          description: Audited per-item outcomes; invited accounts remain activation-pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkEmployeeAccessResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/leave/configuration:
    get:
      tags: [Leave]
      operationId: getAdminLeaveConfiguration
      summary: Read Leave policy, legacy compatibility fields, and scope-aware rollout status
      responses:
        '200':
          description: Leave administration configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLeaveConfiguration'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/leave/units/{unitId}/approver:
    patch:
      tags: [Leave]
      operationId: updateLegacyUnitLeaveApprover
      summary: Update the legacy compatibility Unit Approver used only by LEGACY/SHADOW
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Legacy Unit Approver compatibility value updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Selected approver is not an active employee }

  /admin/leave/employees/{employeeId}/entitlement-group:
    patch:
      tags: [Leave]
      operationId: updateLeaveEntitlementGroup
      summary: Update explicit Leave policy classification independently of approval routing
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group:
                  type: [string, 'null']
                  enum: [education, non_education, null]
      responses:
        '200': { description: Entitlement group updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/leave/employees/{employeeId}/preview:
    get:
      tags: [Leave]
      operationId: previewAdminLeaveApproval
      summary: Preview Leave policy and approval through the submission authority service
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Rollout-aware authority preview; SHADOW includes comparison diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLeaveApprovalPreview'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/organization/designer:
    get:
      tags: [Organization]
      operationId: getOrganizationDesigner
      parameters:
        - name: effectiveDate
          in: query
          schema: { type: string, format: date }
        - name: draftId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective published chart or editable draft chart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDesignerView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/employees:
    get:
      tags: [Organization]
      operationId: listOrganizationDesignerEmployees
      responses:
        '200': { description: Employee options for membership and incumbency }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/foundation-board-accounts:
    get:
      tags: [Organization]
      operationId: listOrganizationDesignerFoundationBoardAccounts
      responses:
        '200': { description: FOUNDATION_BOARD account options with email and account status }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts:
    post:
      tags: [Organization]
      operationId: createOrganizationDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, effectiveOn]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                effectiveOn: { type: string, format: date }
      responses:
        '201':
          description: Draft created from the latest effective published snapshot, or empty when none exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}:
    delete:
      tags: [Organization]
      operationId: discardOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '204': { description: Unpublished DRAFT or VALIDATED change set discarded; audit remains }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Published history is immutable }

  /admin/organization/designer/drafts/{draftId}/nodes:
    post:
      tags: [Organization]
      operationId: createOrganizationNode
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNodeInput' }
      responses:
        '201': { description: Organizational group created in the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/nodes/{itemId}:
    patch:
      tags: [Organization]
      operationId: updateOrganizationNode
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationNodePatch' }
      responses:
        '200': { description: Organizational group updated within the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }
    delete:
      tags: [Organization]
      operationId: deleteOrganizationNodeSubtree
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Draft subtree and dependent draft references deleted atomically with impact counts }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/positions:
    post:
      tags: [Organization]
      operationId: createOrganizationPosition
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPositionInput' }
      responses:
        '201': { description: Authority-bearing position created in the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }

  /admin/organization/designer/drafts/{draftId}/positions/{itemId}:
    patch:
      tags: [Organization]
      operationId: updateOrganizationPosition
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPositionPatch' }
      responses:
        '200': { description: Structural position updated within the draft }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft is not editable }
    delete:
      tags: [Organization]
      operationId: deleteOrganizationPosition
      parameters:
        - { $ref: '#/components/parameters/DraftId' }
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Draft position deleted only when it has no child positions or dependencies }
        '409': { description: Position has child positions/dependencies or draft is immutable }

  /admin/organization/designer/drafts/{draftId}/reopen:
    post:
      tags: [Organization]
      operationId: reopenOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200': { description: The same validated revision reopened as a draft with validation metadata cleared }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revision is not validated and cannot be reopened }

  /admin/organization/designer/drafts/{draftId}/memberships:
    put:
      tags: [Organization]
      operationId: replaceOrganizationMemberships
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeKey, memberships, effectiveFrom]
              properties:
                nodeKey: { type: string, format: uuid }
                memberships:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [employeeId, isPrimary]
                    properties:
                      employeeId: { type: string, format: uuid }
                      isPrimary: { type: boolean, description: Exactly one effective primary membership is permitted per employee; false denotes an additional unit membership. }
                confirmPrimarySwitchEmployeeIds:
                  type: array
                  maxItems: 500
                  description: Required for each employee whose overlapping primary membership on another node is atomically demoted to secondary.
                  items: { type: string, format: uuid }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
      responses:
        '204': { description: Effective memberships replaced only for the selected group; other-node memberships are preserved. }
        '409': { description: An overlapping primary switch needs confirmation, a dual primary would result, or the employee's last effective primary would be removed/demoted without an explicit replacement. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/incumbencies:
    put:
      tags: [Organization]
      operationId: replaceOrganizationIncumbencies
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionKey, effectiveFrom]
              properties:
                positionKey: { type: string, format: uuid }
                holderSource: { type: string, enum: [EMPLOYEE, ACCOUNT], description: Atomically selects the position holder source for this replacement. }
                primaryEmployeeId: { type: [string, 'null'], format: uuid }
                primaryAccountId: { type: [string, 'null'], format: uuid }
                actingEmployeeId: { type: [string, 'null'], format: uuid }
                actingFrom: { type: [string, 'null'], format: date }
                actingTo: { type: [string, 'null'], format: date }
                effectiveFrom: { type: string, format: date }
                assignmentType: { type: string, enum: [PRIMARY_STRUCTURAL, SECONDARY], description: Explicit reporting anchor for an employee with multiple effective positions. }
      responses:
        '204': { description: Primary, vacant, and explicit acting state replaced }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/leader:
    put:
      tags: [Organization]
      operationId: configureOrganizationLeader
      description: Draft-only atomic leader configuration. It may create or select a position, replace the node LEADER binding, update the supplied primary holder, and write an explicitly selected reporting parent. It never infers reporting or creates approval bindings.
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeKey, holderSource, assignmentType, effectiveFrom]
              properties:
                nodeKey: { type: string, format: uuid }
                positionKey: { type: [string, 'null'], format: uuid, description: Existing position in the selected node. }
                title: { type: string, description: Required when creating a new leadership position. }
                holderSource: { type: string, enum: [EMPLOYEE, ACCOUNT] }
                primaryEmployeeId: { type: [string, 'null'], format: uuid }
                primaryAccountId: { type: [string, 'null'], format: uuid }
                assignmentType: { type: string, enum: [PRIMARY_STRUCTURAL, SECONDARY] }
                parentPositionKey: { type: [string, 'null'], format: uuid, description: Optional explicit reports-to position; null does not infer one. }
                effectiveFrom: { type: string, format: date }
      responses:
        '200': { description: Leader configuration saved atomically in the draft. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The selected position belongs to another node or the snapshot is immutable. }

  /admin/organization/designer/drafts/{draftId}/authority-bindings:
    post:
      tags: [Organization]
      operationId: createOrganizationAuthorityBinding
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationAuthorityBindingInput' }
      responses:
        '201': { description: Semantic authority relationship created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/approval-reporting:
    put:
      tags: [Organization]
      operationId: configureOrganizationApprovalReporting
      description: Draft-only atomic guided configuration. Only supplied relationships are replaced or cleared; omitted relationships remain unchanged. No authority is inferred from title, hierarchy, node type, person, or visual rank. Existing binding vacancy policy is preserved, while a new binding uses the selected target position's configured vacancy policy.
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, sourceKey, effectiveFrom]
              properties:
                sourceType: { type: string, enum: [NODE, POSITION] }
                sourceKey: { type: string, format: uuid }
                leaderPositionKey: { type: [string, 'null'], format: uuid, description: NODE only; explicit structure leader. }
                reportsToPositionKey: { type: [string, 'null'], format: uuid, description: Explicit supervisory parent for the source position or selected node leader. }
                unitApproverPositionKey: { type: [string, 'null'], format: uuid, description: NODE only; explicit Unit Approver position. }
                governanceApproverPositionKey: { type: [string, 'null'], format: uuid, description: POSITION only; explicit governance approver. }
                oversightParentPositionKey: { type: [string, 'null'], format: uuid, description: POSITION only; explicit governance oversight parent. }
                effectiveFrom: { type: string, format: date }
      responses:
        '200': { description: Supplied Approval & Reporting relationships saved atomically and audited. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Source/target is missing, self-referential, belongs to an invalid scope, or the draft is immutable. }

  /admin/organization/designer/drafts/{draftId}/reporting-overrides:
    post:
      tags: [Organization]
      operationId: createOrganizationReportingOverride
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, managerPositionKey, reason, effectiveFrom]
              properties:
                employeeId: { type: string, format: uuid }
                managerPositionKey: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
      responses:
        '201': { description: Reasoned effective reporting exception created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/validate:
    post:
      tags: [Organization]
      operationId: validateOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Structural, authority, effective-date, and incumbent validation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationValidationReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/impact:
    get:
      tags: [Organization]
      operationId: previewOrganizationImpact
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Authority-routing and visual-only impact preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationImpactPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/organization/designer/drafts/{draftId}/resolution-preview:
    post:
      tags: [Organization]
      operationId: previewOrganizationResolution
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, workflowKey, effectiveDate]
              properties:
                employeeId: { type: string, format: uuid }
                workflowKey: { type: string }
                effectiveDate: { type: string, format: date }
      responses:
        '200':
          description: Selected-revision structural intent and separate fail-closed workflow readiness
          content:
            application/json:
              schema:
                type: object
                required: [employee, snapshot, effectiveDate, workflowKey, requiredCapability, steps, runtime, structuralIntents, structuralErrors, warnings]
                properties:
                  employee: { type: object }
                  snapshot:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED] }
                  effectiveDate: { type: string, format: date }
                  workflowKey: { type: string }
                  requiredCapability: { type: ['string', 'null'] }
                  steps: { type: array, description: Runtime-actionable approvers only, items: { type: object } }
                  runtime: { type: object }
                  structuralIntents: { type: array, items: { type: object } }
                  structuralErrors: { type: array, items: { type: object } }
                  warnings: { type: array, items: { type: object } }
        '409': { description: Unexpected preview execution failure }

  /admin/organization/designer/drafts/{draftId}/publish:
    post:
      tags: [Organization]
      operationId: publishOrganizationDraft
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Validated snapshot published; a future snapshot does not activate early
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Draft has not passed validation }

  /admin/organization/rollout:
    get:
      tags: [Organization]
      operationId: getOrganizationRollout
      responses:
        '200': { description: Latest rollout configuration; LEGACY when none exists }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Organization]
      operationId: updateOrganizationRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [LEGACY, SHADOW, STRUCTURE] }
                workflowKey: { type: string, default: LEAVE }
                organizationalNodeKey: { type: [string, 'null'], format: uuid }
                effectiveFrom: { type: string, format: date }
                effectiveTo: { type: [string, 'null'], format: date }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Additive effective rollout configuration created and audited }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Actor is not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or intentionally concealed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'

  schemas:
    BulkEmployeeAccessInput:
      type: object
      additionalProperties: false
      required: [employeeIds]
      properties:
        employeeIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }

    BulkEmployeeAccessCategory:
      type: string
      enum:
        - ALREADY_ACTIVE
        - INVITATION_REQUIRED
        - ACCOUNT_PREPARATION_REQUIRED
        - SAFE_REACTIVATION
        - SKIPPED_EMPLOYEE_NOT_ACTIVE
        - SUSPENDED_UNCHANGED
        - REQUIRES_REVIEW

    BulkEmployeeAccessItem:
      type: object
      required: [employeeId, employeeNumber, employeeName, employeeStatus, accountId, accountStatus, category, reasonCode, message]
      properties:
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        employeeName: { type: string }
        employeeStatus: { type: string, enum: [active, inactive, resigned] }
        accountId: { type: [string, 'null'], format: uuid }
        accountStatus: { type: [string, 'null'], enum: [invited, active, suspended, inactive, null] }
        category: { $ref: '#/components/schemas/BulkEmployeeAccessCategory' }
        reasonCode: { type: [string, 'null'] }
        message: { type: string }

    BulkEmployeeAccessPreview:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BulkEmployeeAccessItem' }
        summary:
          type: object
          required: [selected, alreadyActive, invitationRequired, accountPreparationRequired, safeReactivation, skippedInactiveOrResigned, suspendedUnchanged, requiresReview]
          properties:
            selected: { type: integer, minimum: 1, maximum: 200 }
            alreadyActive: { type: integer, minimum: 0 }
            invitationRequired: { type: integer, minimum: 0 }
            accountPreparationRequired: { type: integer, minimum: 0 }
            safeReactivation: { type: integer, minimum: 0 }
            skippedInactiveOrResigned: { type: integer, minimum: 0 }
            suspendedUnchanged: { type: integer, minimum: 0 }
            requiresReview: { type: integer, minimum: 0 }

    BulkEmployeeAccessResult:
      type: object
      required: [bulkOperationId, items, summary]
      properties:
        bulkOperationId: { type: string, format: uuid }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/BulkEmployeeAccessItem' }
              - type: object
                required: [action, resultingAccountStatus]
                properties:
                  action:
                    type: string
                    enum: [ALREADY_ACTIVE, INVITATION_ISSUED, ACCOUNT_PREPARED_AND_INVITATION_ISSUED, ACCOUNT_REACTIVATED, SKIPPED_EMPLOYEE_NOT_ACTIVE, SUSPENDED_UNCHANGED, REQUIRES_REVIEW, FAILED]
                  resultingAccountStatus: { type: [string, 'null'], enum: [invited, active, suspended, inactive, null] }
                  activationPath:
                    type: string
                    description: One-time plaintext issuance response only; never persisted or audited
                  activationExpiresAt: { type: string, format: date-time }
        summary:
          type: object
          required: [selected, alreadyActive, accountsPrepared, activationInvitationsIssuedOrReissued, accountsSafelyReactivated, skippedInactiveOrResigned, suspendedUnchanged, requiresReview, failed]
          properties:
            selected: { type: integer, minimum: 1, maximum: 200 }
            alreadyActive: { type: integer, minimum: 0 }
            accountsPrepared: { type: integer, minimum: 0 }
            activationInvitationsIssuedOrReissued: { type: integer, minimum: 0 }
            accountsSafelyReactivated: { type: integer, minimum: 0 }
            skippedInactiveOrResigned: { type: integer, minimum: 0 }
            suspendedUnchanged: { type: integer, minimum: 0 }
            requiresReview: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }

    OrganizationRolloutMode:
      type: string
      enum: [LEGACY, SHADOW, STRUCTURE]

    LeaveAuthorityStep:
      type: object
      required: [employeeId, sources]
      properties:
        employeeId: { type: string, format: uuid }
        sources:
          type: array
          minItems: 1
          items:
            type: string
            enum: [DIRECT_MANAGER, UNIT_APPROVER, GOVERNANCE_APPROVER]

    AdminLeaveConfiguration:
      type: object
      required: [policies, units, employees, summary, rollout]
      properties:
        policies:
          type: array
          items: { type: object, additionalProperties: true }
        units:
          type: array
          items:
            type: object
            required: [id, name, activeEmployeeCount, approverEmployeeId, rolloutState]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              activeEmployeeCount: { type: integer, minimum: 0 }
              approverEmployeeId: { type: [string, 'null'], format: uuid }
              approverName: { type: [string, 'null'] }
              rolloutState: { type: string, enum: [LEGACY, SHADOW, STRUCTURE, MIXED] }
        employees:
          type: array
          items:
            type: object
            required: [id, fullName, employeeNumber, status, rolloutMode]
            properties:
              id: { type: string, format: uuid }
              fullName: { type: string }
              employeeNumber: { type: string }
              status: { type: string, enum: [active, inactive, resigned] }
              unitId: { type: [string, 'null'], format: uuid }
              unitName: { type: [string, 'null'] }
              positionName: { type: [string, 'null'] }
              directManagerEmployeeId: { type: [string, 'null'], format: uuid }
              directManagerName: { type: [string, 'null'] }
              leaveEntitlementGroup: { type: [string, 'null'], enum: [education, non_education, null] }
              rolloutMode: { $ref: '#/components/schemas/OrganizationRolloutMode' }
        summary:
          type: object
          required: [activeUnits, unitApproverConfigured, activeEmployees, directManagerConfigured, entitlementGroupConfigured]
          properties:
            activeUnits: { type: integer, minimum: 0 }
            unitApproverConfigured: { type: integer, minimum: 0 }
            activeEmployees: { type: integer, minimum: 0 }
            directManagerConfigured: { type: integer, minimum: 0 }
            entitlementGroupConfigured: { type: integer, minimum: 0 }
        rollout:
          type: object
          required: [workflowKey, effectiveDate, state, counts]
          properties:
            workflowKey: { type: string, const: leave.annual }
            effectiveDate: { type: string, format: date }
            state: { type: string, enum: [LEGACY, SHADOW, STRUCTURE, MIXED] }
            counts:
              type: object
              required: [LEGACY, SHADOW, STRUCTURE]
              properties:
                LEGACY: { type: integer, minimum: 0 }
                SHADOW: { type: integer, minimum: 0 }
                STRUCTURE: { type: integer, minimum: 0 }

    AdminLeaveApprovalPreview:
      type: object
      required: [employee, referenceDate, approvalChain, routing, annualLeave, warnings]
      properties:
        employee: { type: object, additionalProperties: true }
        referenceDate: { type: string, format: date }
        approvalChain:
          type: array
          items: { $ref: '#/components/schemas/LeaveAuthorityStep' }
        routing:
          type: object
          required: [mode, authoritativeSource, structuralCandidateChain, comparison]
          properties:
            mode: { $ref: '#/components/schemas/OrganizationRolloutMode' }
            authoritativeSource: { type: string, enum: [LEGACY, STRUCTURE] }
            structuralCandidateChain:
              oneOf:
                - type: 'null'
                - type: array
                  items: { $ref: '#/components/schemas/LeaveAuthorityStep' }
            comparison:
              oneOf:
                - type: 'null'
                - type: object
                  required: [status, reasons]
                  properties:
                    status: { type: string, enum: [MATCH, MISMATCH] }
                    reasons: { type: array, items: { type: string } }
                    error:
                      type: object
                      properties:
                        code: { type: string }
                        message: { type: string }
        annualLeave:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: true
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }

    OrganizationDraft:
      type: object
      required: [id, name, effectiveOn, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        effectiveOn: { type: string, format: date }
        status: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED] }
        validationReport: { oneOf: [{ $ref: '#/components/schemas/OrganizationValidationReport' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        validatedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        baseChangeSetId: { type: [string, 'null'], format: uuid }

    OrganizationNodeInput:
      type: object
      required: [name, nodeType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }
        integrationCode: { type: [string, 'null'] }

    OrganizationNodePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nodeType: { type: string, minLength: 1, maxLength: 80 }
        parentNodeKey: { type: [string, 'null'], format: uuid }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        integrationCode: { type: [string, 'null'] }
        active: { type: boolean }

    OrganizationPositionInput:
      type: object
      required: [nodeKey, title]
      properties:
        nodeKey: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        parentPositionKey: { type: [string, 'null'], format: uuid }
        singleIncumbent: { type: boolean, default: true }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10, default: 0 }
        holderSource: { type: string, enum: [EMPLOYEE, ACCOUNT], default: EMPLOYEE }

    OrganizationPositionPatch:
      type: object
      minProperties: 1
      properties:
        nodeKey: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        parentPositionKey: { type: [string, 'null'], format: uuid }
        singleIncumbent: { type: boolean }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        visualRankOffset: { type: integer, minimum: 0, maximum: 10 }
        holderSource: { type: string, enum: [EMPLOYEE, ACCOUNT] }
        active: { type: boolean }

    OrganizationAuthorityBindingInput:
      type: object
      required: [sourceType, sourceKey, authorityType, targetPositionKey, vacancyPolicy, effectiveFrom]
      properties:
        sourceType: { type: string, enum: [NODE, POSITION] }
        sourceKey: { type: string, format: uuid }
        authorityType: { type: string, enum: [SUPERVISORY_PARENT, LEADER, UNIT_APPROVER, GOVERNANCE_APPROVER, OVERSIGHT_PARENT] }
        targetPositionKey: { type: string, format: uuid }
        vacancyPolicy: { type: string, enum: [CLIMB_TO_PARENT, REQUIRE_ACTING_OR_BLOCK, BLOCK] }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }

    OrganizationValidationReport:
      type: object
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              severity: { type: string, enum: [ERROR, WARNING] }
              itemKey: { type: [string, 'null'] }

    OrganizationImpactPreview:
      type: object
      required: [structureChanges, directManagerChanges, unitApproverChanges, authorityPathsAffected, vacantAuthorities, unresolvedEmployees, visualOnlyChanges, noApprovalRoutingImpact]
      properties:
        structureChanges:
          type: object
          required: [nodes, positions, memberships, incumbencies, authorityRelationships, reportingRelationships]
          properties:
            nodes: { type: integer, minimum: 0 }
            positions: { type: integer, minimum: 0 }
            memberships: { type: integer, minimum: 0 }
            incumbencies: { type: integer, minimum: 0 }
            authorityRelationships: { type: integer, minimum: 0 }
            reportingRelationships: { type: integer, minimum: 0 }
        directManagerChanges: { type: array, items: { type: object } }
        unitApproverChanges: { type: array, items: { type: object } }
        authorityPathsAffected: { type: array, items: { type: object } }
        vacantAuthorities: { type: array, items: { type: object } }
        unresolvedEmployees: { type: array, items: { type: object } }
        visualOnlyChanges: { type: array, items: { type: object } }
        noApprovalRoutingImpact: { type: boolean }

    OrganizationDesignerView:
      type: object
      required: [viewDate, mode, nodes, positions, memberships, assignments, bindings, reportingOverrides]
      properties:
        viewDate: { type: string, format: date }
        mode: { type: string, enum: [HISTORICAL, CURRENT, FUTURE, DRAFT] }
        draft: { oneOf: [{ $ref: '#/components/schemas/OrganizationDraft' }, { type: 'null' }] }
        nodes: { type: array, items: { type: object } }
        positions: { type: array, items: { type: object } }
        memberships: { type: array, items: { type: object } }
        assignments: { type: array, items: { type: object } }
        bindings: { type: array, items: { type: object } }
        reportingOverrides: { type: array, items: { type: object } }

    Session:
      type: object
      required: [actor, permissions]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        permissions:
          type: array
          items:
            type: string

    Actor:
      type: object
      required: [id, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [employee, candidate, system]
        displayName:
          type: string
        employeeId:
          type: [string, 'null']
          format: uuid

    EmployeeProfile:
      type: object
      required: [id, employeeNumber, fullName, status]
      properties:
        id:
          type: string
          format: uuid
        employeeNumber:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum: [active, inactive, resigned]
        unit:
          $ref: '#/components/schemas/Reference'
        position:
          $ref: '#/components/schemas/Reference'
        directManager:
          oneOf:
            - $ref: '#/components/schemas/Reference'
            - type: 'null'

    Reference:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string

    LeaveRequestInput:
      type: object
      required: [leaveTypeId, startDate, endDate, reason]
      properties:
        leaveTypeId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        partialDay:
          type: [string, 'null']
          enum: [null, morning, afternoon]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        attachmentIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid

    LeavePreview:
      type: object
      required: [workingDays, balanceBefore, balanceAfter, conflicts]
      properties:
        workingDays:
          type: number
          minimum: 0
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        conflicts:
          type: array
          items:
            type: string

    LeaveRequest:
      type: object
      required: [id, status, employeeId, leaveType, startDate, endDate, workingDays, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, submitted, in_review, approved, rejected, cancelled]
        employeeId:
          type: string
          format: uuid
        leaveType:
          $ref: '#/components/schemas/Reference'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        workingDays:
          type: number
        reason:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    ApprovalTask:
      type: object
      required: [id, requestType, requestId, status, version]
      properties:
        id:
          type: string
          format: uuid
        requestType:
          type: string
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, approved, rejected, skipped, reassigned]
        version:
          type: integer
          minimum: 1

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
